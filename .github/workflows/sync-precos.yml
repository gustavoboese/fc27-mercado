name: sync-precos
on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
jobs:
  precos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Atualizar precos
        shell: pwsh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: ./scripts/sync-precos.ps1
