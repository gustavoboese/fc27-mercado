<script>const { useState, useMemo, useEffect } = React;
const STORE = "sbc-solver-club-v1";
function loadSaved() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return [];
    const v = JSON.parse(raw);
    return Array.isArray(v) ? migrarPos(v) : [];
  } catch (e) {
    return [];
  }
}
function save(players) {
  try {
    localStorage.setItem(STORE, JSON.stringify(players));

}

// Quando corre dentro da extensão, existe uma ponte que vai buscar os dados
// directamente ao FUT.GG. Fora dela, fica tudo como está (bookmarklets).
const EXT = typeof window !== "undefined" && window.FUTGG ? window.FUTGG : null;
function idadeTexto(ts) {
  if (!ts) return null;
  const min = Math.round((Date.now() - ts) / 60000);
  if (min < 1) return "agora mesmo";
  if (min < 60) return `há ${min} min`;
  const h = Math.round(min / 60);
  if (h < 24) return `há ${h}h`;
  return `há ${Math.round(h / 24)} dias`;
}

// Sincronização com a conta: quando a página corre publicada, o db guarda
// o clube e os preços, e ficam acessíveis de qualquer dispositivo.
let _dbP = null;
// ---- Conta na nuvem (Supabase Auth + tabela estado, protegida por RLS) ----
const AUTH_KEY = "sbc-supa-session";
const NUVEM_SKIP = { mercado: 1, prices: 1 }; // o mercado vem da tabela publica, nao se guarda por utilizador
function sessLer() {
  try { return JSON.parse(localStorage.getItem(AUTH_KEY) || "null"); } catch (e) { return null; }
}
function sessGuardar(s) {
  try { if (s) localStorage.setItem(AUTH_KEY, JSON.stringify(s)); else localStorage.removeItem(AUTH_KEY); } catch (e) {}
}
function sessDeTokens(at, rt, expIn) {
  let uid = null, email = null;
  try {
    const p = JSON.parse(atob(at.split(".")[1].replace(/-/g, "+").replace(/_/g, "/")));
    uid = p.sub; email = p.email || null;
  } catch (e) {}
  return { at, rt, uid, email, exp: Date.now() + (Number(expIn) || 3600) * 1000 };
}
// Entrada pelo link do email: o Supabase volta aqui com os tokens no #hash.
(function () {
  try {
    const h = location.hash || "";
    if (h.indexOf("access_token=") >= 0) {
      const q = new URLSearchParams(h.slice(1));
      const at = q.get("access_token"), rt = q.get("refresh_token");
      if (at && rt) {
        sessGuardar(sessDeTokens(at, rt, q.get("expires_in")));
        window.history.replaceState(null, "", location.pathname + location.search);
      }
    }
  } catch (e) {}
})();
async function authToken() {
  let s = sessLer();
  if (!s) return null;
  if (s.exp - Date.now() > 60000) return s;
  try {
    const r = await fetch(`${SUPA_URL}/auth/v1/token?grant_type=refresh_token`, {
      method: "POST",
      headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: s.rt })
    });
    if (!r.ok) { sessGuardar(null); return null; }
    const j = await r.json();
    s = sessDeTokens(j.access_token, j.refresh_token, j.expires_in);
    sessGuardar(s);
    return s;
  } catch (e) {
    return s.exp > Date.now() ? s : null;
  }
}
async function authPedirCodigo(email) {
  const r = await fetch(`${SUPA_URL}/auth/v1/otp`, {
    method: "POST",
    headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ email, create_user: true, gotrue_meta_security: {} })
  });
  if (!r.ok) {
    let m = "";
    try { const j = await r.json(); m = j.msg || j.error_description || j.message || ""; } catch (e) {}
    throw new Error(m || `HTTP ${r.status}`);
  }
}
async function authVerificar(email, token) {
  const r = await fetch(`${SUPA_URL}/auth/v1/verify`, {
    method: "POST",
    headers: { apikey: SUPA_KEY, "Content-Type": "application/json" },
    body: JSON.stringify({ type: "email", email, token })
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok || !j.access_token) throw new Error(j.msg || j.error_description || j.message || `HTTP ${r.status}`);
  sessGuardar(sessDeTokens(j.access_token, j.refresh_token, j.expires_in));
}
function dbNuvem() {
  return {
    doc(path) {
      const chave = String(path).replace(/^state\//, "");
      return {
        async get() {
          if (NUVEM_SKIP[chave]) return { exists: false, data: () => null };
          const s = await authToken();
          if (!s) throw new Error("sem sessao");
          const r = await fetch(`${SUPA_URL}/rest/v1/estado?chave=eq.${encodeURIComponent(chave)}&select=valor`, {
            headers: { apikey: SUPA_KEY, Authorization: `Bearer ${s.at}` }
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
          const rows = await r.json();
          return rows.length ? { exists: true, data: () => rows[0].valor } : { exists: false, data: () => null };
        },
        async set(body) {
          if (NUVEM_SKIP[chave]) return;
          const s = await authToken();
          if (!s) throw new Error("sem sessao");
          const r = await fetch(`${SUPA_URL}/rest/v1/estado?on_conflict=user_id,chave`, {
            method: "POST",
            headers: {
              apikey: SUPA_KEY,
              Authorization: `Bearer ${s.at}`,
              "Content-Type": "application/json",
              Prefer: "resolution=merge-duplicates,return=minimal"
            },
            body: JSON.stringify([{ user_id: s.uid, chave, valor: body, atualizado_em: new Date().toISOString() }])
          });
          if (!r.ok) throw new Error("HTTP " + r.status);
        }
      };
    }
  };
}
function getDb() {
  if (!_dbP) {
    if (typeof window !== "undefined" && window.claude && window.claude.use) {
      _dbP = window.claude.use("db").catch(() => null);
    } else {
      _dbP = authToken().then(s => (s ? dbNuvem() : null)).catch(() => null);
    }
  }
  return _dbP;
}
async function dbSet(path, body) {
  const db = await getDb();
  if (!db) return false;
  try {
    await db.doc(path).set(body);
    return true;
  } catch (e) {
    return false;
  }
}
async function dbGet(path) {
  const db = await getDb();
  if (!db) return null;
  try {
    const snap = await db.doc(path).get();
    return snap && snap.exists ? snap.data() : null;
  } catch (e) {
    return null;
  }
}
const MSTORE = "sbc-solver-mercado";
function loadMercado() {

    return JSON.parse(localStorage.getItem(MSTORE) || "{}") || {};

    return {};
  }
}

// Cartas compráveis a sério: cada uma é um jogador distinto, com clube, liga
// e nação, por isso conta para os requisitos como qualquer outra.
function cartasMercado(mercado) {
  const out = [];
  Object.keys(mercado || {}).forEach(r => {
    (mercado[r] || []).forEach(c => {
      if (!c.pr) return;
      if (c.at && Date.now() - c.at > 36 * 3600 * 1000) return;
      out.push({
        key: `mkt-${c.id}`,
        ident: `ea-${c.id}`,
        name: `${c.n} (comprar)`,
        rating: Number(c.o) || Number(r),
        position: c.p || "?",
        altPositions: c.ap || [],
        nation: c.na || "?",
        league: c.lg || "?",
        club: c.cl || "?",
        rarity: c.ra || "?",
        untradeable: false,
        price: Number(c.pr),
        inActiveSquad: false,
        owned: false,
        market: true
      });
    });
  });
  return out;
}
// ---- Mercado online (Supabase, preenchido todos os dias pelo fc27-mercado) ----
const SUPA_URL = "https://lbxelhaccyybauhsazch.supabase.co";
const SUPA_KEY = "sb_publishable_-zvChUp_r_zQpTqvg-UJUA_cpE8MPDK"; // chave pública, só leitura
const SUPA_STATE = { ok: false };
async function supaTabela(tabela, colunas) {
  const out = [];
  for (let off = 0; off < 20000; off += 1000) {
    const url = `${SUPA_URL}/rest/v1/${tabela}?select=${colunas}&order=ea_id.asc&limit=1000&offset=${off}`;
    const r = await fetch(url, { headers: { apikey: SUPA_KEY } });
    if (!r.ok) throw new Error(`${tabela}: HTTP ${r.status}`);
    const rows = await r.json();
    if (!Array.isArray(rows)) throw new Error(`${tabela}: resposta inesperada`);
    out.push(...rows);
    if (rows.length < 1000) break;
  }
  return out;
}
async function lerMercadoSupabase() {
  const [cartas, precos] = await Promise.all([
    supaTabela("cartas", "ea_id,nome,overall,posicao,posicoes_alt,clube,liga,nacao,raridade"),
    supaTabela("precos", "ea_id,preco_consola,atualizado_em")
  ]);
  const preco = new Map();
  precos.forEach(p => preco.set(p.ea_id, p));
  const mercado = {};
  let maxAt = 0, n = 0;
  cartas.forEach(c => {
    const p = preco.get(c.ea_id);
    if (!p || !(p.preco_consola > 0)) return;
    const at = Date.parse(p.atualizado_em) || 0;
    if (at > maxAt) maxAt = at;
    const rt = String(c.overall);
    if (!mercado[rt]) mercado[rt] = [];
    mercado[rt].push({
      id: c.ea_id, n: c.nome, o: c.overall, p: c.posicao,
      ap: c.posicoes_alt || [], na: c.nacao, lg: c.liga, cl: c.clube,
      ra: c.raridade, pr: p.preco_consola, at
    });
    n++;
  });
  if (!n) throw new Error("A tabela veio vazia.");
  return { mercado, at: maxAt, n };
}
const CSTORE = "sbc-solver-cards";
const MAX_CARTAS = 600;
const MAX_PONTOS = 40;
function loadCartas() {
  try {
    return JSON.parse(localStorage.getItem(CSTORE) || "{}") || {};
  } catch (e) {
    return {};
  }
}
function saveCartas(c) {
  try {
    localStorage.setItem(CSTORE, JSON.stringify(c));
  } catch (e) {}
}

// Junta o que foi lido numa passagem ao que já seguíamos. Guarda um ponto por
// carta e por passagem, só quando o preço mudou.
function juntarCartas(actual, lidas, rating) {
  const out = {
    ...actual
  };
  const agora = Date.now();
  lidas.forEach(c => {
    if (!c.eaId) return;
    const ant = out[c.eaId];
    const h = ant ? [...ant.h] : [];
    const ultimo = h.length ? h[h.length - 1][1] : null;
    const preco = c.extinta ? null : c.price;
    if (preco != null && preco !== ultimo) h.push([agora, preco]);
    out[c.eaId] = {
      slug: c.slug || ant && ant.slug || "",
      pos: c.pos || ant && ant.pos || "",
      rating: rating || ant && ant.rating || null,
      meta: c.meta != null ? c.meta : ant && ant.meta,
      extinta: !!c.extinta,
      ult: preco != null ? preco : ant && ant.ult,
      visto: agora,
      h: h.slice(-MAX_PONTOS)
    };
  });
  // Se crescer demasiado, larga as que não vemos há mais tempo.
  const ids = Object.keys(out);
  if (ids.length > MAX_CARTAS) {
    ids.sort((a, b) => (out[a].visto || 0) - (out[b].visto || 0));
    ids.slice(0, ids.length - MAX_CARTAS).forEach(id => delete out[id]);
  }
  return out;
}
function nomeBonito(slug) {
  return String(slug || "").split("-").filter(Boolean).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
}
function analisarCarta(c) {
  const pts = (c.h || []).map(([at, v]) => ({
    at,
    v
  }));
  if (!pts.length) return null;
  const vs = pts.map(x => x.v);
  const agora = vs[vs.length - 1];
  const min = Math.min(...vs),
    max = Math.max(...vs);
  const alvo = Date.now() - 7 * 24 * 3600 * 1000;
  let ref = pts[0];
  for (const x of pts) if (x.at <= alvo) ref = x;
  const variacao = ref.v ? Math.round((agora - ref.v) / ref.v * 100) : 0;
  return {
    pts,
    agora,
    min,
    max,
    variacao,
    n: pts.length

// Estatísticas por rating a partir da série.
function analisarHistorico(historico, rating) {
  const pontos = historico.filter(a => a.p[rating] != null).map(a => ({
    at: a.at,
    v: a.p[rating]
  }));
  if (!pontos.length) return null;
  const vals = pontos.map(x => x.v);
  const agora = vals[vals.length - 1];
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const media = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);

  // Referência de há ~7 dias, ou a amostra mais antiga que houver.
  const alvo = Date.now() - 7 * 24 * 3600 * 1000;
  let ref = pontos[0];
  for (const x of pontos) {
    if (x.at <= alvo) ref = x;
  }
  const variacao = ref.v ? Math.round((agora - ref.v) / ref.v * 100) : 0;

  // Onde está o preço actual dentro da amplitude observada: 0% = mínimo.
  const posicao = max > min ? Math.round((agora - min) / (max - min) * 100) : 50;
  return {
    pontos,
    agora,
    min,
    max,
    media,
    variacao,
    posicao,
    n: pontos.length
  };
}

function interpretarNotas(c) {

    } else if (m = l.match(/^Same\s+(league|nation|nationality|club)\s*:?\s*(Min|Max)\.?\s*(\d+)/i)) {

// Devolve o quanto falta para cumprir (0 = cumprido) e o valor observado.
function avaliarReq(sel, r) {
  const n = Number(r.value);
  const ordemQ = {
    bronze: 0,
    silver: 1,
    gold: 2
  };
  switch (r.field) {
    case "qualityMin":
      {
        const alvo = ordemQ[String(r.value).toLowerCase()];
        if (alvo == null) return {
          falta: 0,
          obs: "?"
        };
        const maus = sel.filter(p => ordemQ[tierOf(p.rating).toLowerCase()] < alvo).length;
        return {
          falta: maus,
          obs: `${sel.length - maus}/${sel.length}`
        };
      }
    case "sameClubMin":
    case "sameLeagueMin":
    case "sameNationMin":
      {
        const campo = r.field === "sameClubMin" ? "club" : r.field === "sameLeagueMin" ? "league" : "nation";
        const m = maxDe(contar(sel, campo));
        return {
          falta: Math.max(0, n - m),
          obs: m
        };
      }
    case "sameClubMax":
    case "sameLeagueMax":
    case "sameNationMax":
      {
        const campo = r.field === "sameClubMax" ? "club" : r.field === "sameLeagueMax" ? "league" : "nation";
        const cont = contar(sel, campo);
        const excesso = Object.values(cont).reduce((a, v) => a + Math.max(0, v - n), 0);
        return {
          falta: excesso,
          obs: maxDe(cont)
        };
      }
    case "maxClubs":
    case "minClubs":
    case "maxLeagues":
    case "minLeagues":
    case "maxNations":
    case "minNations":
    case "exactClubs":
    case "exactLeagues":
    case "exactNations":
      {
        const campo = r.field.endsWith("Clubs") ? "club" : r.field.endsWith("Leagues") ? "league" : "nation";
        const d = Object.keys(contar(sel, campo)).length;
        const eMax = r.field.startsWith("max");
        const eExato = r.field.startsWith("exact");
        return {
          falta: eExato ? Math.abs(d - n) : eMax ? Math.max(0, d - n) : Math.max(0, n - d),
          obs: d
        };
      }
    default:
      {
        const c = countMatching(sel, r);
        return {
          falta: Math.max(0, Number(r.min) - c),
          obs: c
        };
      }

}
function countMatching(selection, r) {
  if (r.field === "ratingMin") return selection.filter(p => p.rating >= Number(r.value)).length;
  if (r.field === "ratingMax") return selection.filter(p => p.rating <= Number(r.value)).length;
  if (r.field === "tier") {
    const band = TIERS[String(r.value).toLowerCase()];
    if (!band) return 0;
    return selection.filter(p => p.rating >= band[0] && p.rating <= band[1]).length;
  }
  // value pode trazer alternativas separadas por | (ex: "Romania|Sweden")
  const alvos = String(r.value).toLowerCase().split("|");
  return selection.filter(p => alvos.includes(String(p[r.field]).toLowerCase())).length;

function detectLoan(item) {
  if (!item || typeof item !== "object") return null;
  if (typeof item.playerType === "string" && /loan/i.test(item.playerType)) return true;
  for (const k of Object.keys(item)) {
    if (!/loan/i.test(k)) continue;
    const v = item[k];
    if (v === true) return true;
    if (typeof v === "number" && v > 0) return v;
    if (typeof v === "string" && v.trim() && !/^(0|false|none|null|no)$/i.test(v.trim())) return true;
    if (v && typeof v === "object") {
      const nums = Object.values(v).filter(x => typeof x === "number" && x > 0);
      if (nums.length) return nums[0];
      if (Object.values(v).some(x => x === true)) return true;
    }
  }
  return null;
}
function parseClubJson(raw) {

  } catch (e) {
    return {
      players: [],
      errors: ["O texto colado não é JSON válido."],
      pages: []
    };
  }
  const players = [];
  const pages = [];
  blobs.forEach(blob => {
    // Formato reduzido, vindo do snippet da consola
    if (Array.isArray(blob?.slim)) {
      pages.push({
        page: "slim",
        total: blob.total ?? null,
        count: blob.slim.length
      });
      blob.slim.forEach(s => {
        players.push({
          key: s.k,
          name: s.n || "sem nome",
          rating: s.r ?? 0,
          position: POS[s.p] ?? "?",

          loan: s.lo != null && s.lo !== false && s.lo !== 0,
          loans: typeof s.lo === "number" ? s.lo : null,
          owned: true,
          ident: String(s.n || s.k)

    }
    const rows = blob?.data;
    if (!Array.isArray(rows)) {
      errors.push("Um dos blocos não tem um array 'data' nem 'slim' — ignorado.");
      return;
    }
    pages.push({
      page: blob.currentPage ?? "?",
      total: blob.total ?? null,
      count: rows.length
    });
    rows.forEach(item => {
      const def = item.playerDef;
      if (!def) return;
      const name = def.commonName || [def.firstName, def.lastName].filter(Boolean).join(" ") || "sem nome";
      const lo = detectLoan(item);
      players.push({
        key: item.id,
        name,
        rating: def.overall ?? 0,
        position: POS[def.position] ?? "?",
        altPositions: (def.alternativePositionIds || []).map(p => POS[p]).filter(Boolean),
